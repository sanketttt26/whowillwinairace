# Publishes a GitHub release whenever main has a package.json version that hasn't been released yet.
# To release: bump "version" in package.json, add a "## vX.Y.Z" section to CHANGELOG.md, merge to main.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release this version if it's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" >/dev/null 2>&1; then echo "$v is already released"; exit 0; fi
          awk -v h="## $v" '$0 == h {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes-file notes.md --generate-notes
