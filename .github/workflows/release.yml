# Push a tag like v1.2.0 and this publishes the GitHub release for it.
# Release notes come from the annotated tag's message, followed by GitHub's auto-generated changelog.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --tags origin   # checkout can store annotated tags as lightweight; refetch to keep the message
          git tag -l --format='%(contents)' "$TAG" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes --verify-tag
